services:
  - type: web
    name: ats-backend
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
        # REQUIRED: PostgreSQL connection string from Supabase
        # Example: postgresql://postgres:password@db.xxxxx.supabase.co:5432/postgres
        # Get from: Supabase Dashboard → Settings → Database → Connection string
      - key: GITHUB_TOKEN
        sync: false
        # Optional: Add GitHub token for higher API rate limits
    healthCheckPath: /api/health
